<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wonderful Color · 莫奈配色</title>
  <meta name="description" content="基于 Material You 动态配色(Monet)的主题生成器:输入一个源色,生成完整的深浅色配色方案。">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">

  <!-- 百度统计 -->
  <script>
    var _hmt = _hmt || [];
    (function () {
      var hm = document.createElement("script");
      hm.src = "https://hm.baidu.com/hm.js?73a214d8a13386945b65c7fb7707b71b";
      var s = document.getElementsByTagName("script")[0];
      s.parentNode.insertBefore(hm, s);
    })();
  </script>
</head>
<body>
  <!-- 页首:品牌 + 语言/主题控制 -->
  <header class="masthead">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <div class="brand-text">
        <h1 data-i18n="app.title"></h1>
        <p class="subtitle" data-i18n="header.subtitle"></p>
      </div>
    </div>
    <div class="masthead-actions">
      <!-- 语言菜单:选项由 render.js 根据 supportedLangs 动态渲染 -->
      <div class="lang-menu">
        <button id="lang-btn" class="icon-btn" type="button" aria-haspopup="menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
        </button>
        <div id="lang-list" class="lang-list" role="menu"></div>
      </div>
      <button id="theme-toggle" class="icon-btn" type="button">
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <!-- 源色:大色块取色舞台 + 方案类型 + 预设色 -->
    <section class="section" id="seed">
      <h2 data-i18n="seed.title"></h2>
      <p class="desc" data-i18n="seed.desc"></p>
      <div class="seed-stage-wrap">
        <!-- 点击大色块展开自定义取色器(js/picker.js 动态挂载) -->
        <button class="seed-stage" id="seed-stage" type="button">
          <span class="seed-stage-label" data-i18n="seed.custom"></span>
          <span class="seed-stage-hex" id="seed-stage-hex">#6750A4</span>
        </button>
        <div class="seed-side">
          <label class="field">
            <span>Hex</span>
            <input type="text" id="hex-input" value="#6750A4" spellcheck="false" maxlength="7">
          </label>
        </div>
      </div>
      <h3 class="subhead" data-i18n="seed.variant"></h3>
      <div id="variant-chips" class="chip-row"></div>
      <h3 class="subhead" data-i18n="seed.presets"></h3>
      <div id="preset-row" class="chip-row"></div>
    </section>

    <!-- 配色方案:浅色 / 深色角色色板 -->
    <section class="section" id="scheme">
      <h2 data-i18n="scheme.title"></h2>
      <p class="desc" data-i18n="scheme.desc"></p>
      <div id="scheme-grid" class="scheme-grid"></div>
    </section>

    <!-- 色调板:关键色展开的 13 级官方色阶 -->
    <section class="section" id="palette">
      <h2 data-i18n="palette.title"></h2>
      <p class="desc" data-i18n="palette.desc"></p>
      <div id="palette-list"></div>
    </section>

    <!-- 新手指南:命名规律 + 搭配速查表 -->
    <section class="section" id="guide">
      <h2 data-i18n="guide.title"></h2>
      <p class="desc" data-i18n="guide.desc"></p>
      <div id="guide-rules" class="guide-rules"></div>
      <h3 class="subhead" data-i18n="guide.table.title"></h3>
      <div class="table-wrap">
        <table class="pair-table" id="pair-table"></table>
      </div>
    </section>

    <!-- 组件预览 -->
    <section class="section" id="preview">
      <h2 data-i18n="preview.title"></h2>
      <p class="desc" data-i18n="preview.desc"></p>
      <div id="preview-grid" class="scheme-grid"></div>
    </section>

    <!-- 导出 -->
    <section class="section" id="export">
      <h2 data-i18n="export.title"></h2>
      <p class="desc" data-i18n="export.desc"></p>
      <div class="export-actions">
        <button id="copy-css" class="action-btn" type="button" data-i18n="export.copyCss"></button>
        <button id="copy-json" class="action-btn secondary" type="button" data-i18n="export.copyJson"></button>
      </div>
    </section>

    <footer><p data-i18n="footer"></p></footer>
  </main>

  <div id="toast" role="status"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
